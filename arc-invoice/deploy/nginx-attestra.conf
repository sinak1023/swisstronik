# Attestra nginx site config.
# Option A (recommended): serve static files directly from nginx, no Node needed.
# Option B: reverse-proxy to the Node static server on 127.0.0.1:8080.
#
# Install:
#   sudo cp deploy/nginx-attestra.conf /etc/nginx/sites-available/attestra
#   sudo ln -s /etc/nginx/sites-available/attestra /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# For HTTPS:  sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # or your public IP

    # ---- Option A: serve static frontend directly ----
    root /opt/attestra/frontend;
    index index.html;

    # Correct MIME for ES modules
    location ~* \.(js|mjs)$ {
        types { } default_type "text/javascript; charset=utf-8";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Option B: uncomment to reverse-proxy to Node instead ----
    # location / {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Security headers
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # No file uploads ever hit this server; cap body size small.
    client_max_body_size 1m;
}
