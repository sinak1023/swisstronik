; طولانی‌کردن عمر نشست (Session) — جلوگیری از خروج زودهنگام کاربران
; مقدار بر حسب ثانیه است (۸۶۴۰۰ = ۲۴ ساعت). در صورت نیاز بیشتر کنید.
session.gc_maxlifetime = 86400
session.cookie_lifetime = 86400

; افزایش سقف آپلود برای ایمپورت فایل‌های بزرگ لید
upload_max_filesize = 32M
post_max_size = 33M
max_execution_time = 120
